<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A demo of a fictional firm has no business in search results, and a client's
         letters are behind a login that a crawler cannot pass anyway. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Orca Edge · Document Generation and Review</title>
    <meta name="description" content="A firm's own letters, counted for what never changes, so standard clauses are reproduced exactly and only the rest is written fresh. Signed off by a person, always." />
    <meta name="theme-color" content="#0E2237" />
    <meta name="color-scheme" content="light" />

    <!-- How the link looks when it is sent to a solicitor, which is how it will
         mostly arrive. -->
    <!-- Absolute, not relative. LinkedIn and most other scrapers will not resolve a
         relative og:image and simply show no picture, which is the one thing this exists
         to prevent. The filename is versioned because a scraper keeps what it fetched for
         days, and what it has is the version where the logo came out red. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://demo.orcaedge.io/" />
    <meta property="og:site_name" content="Orca Edge" />
    <meta property="og:title" content="Document Generation and Review" />
    <meta property="og:description" content="Your firm's own letters, in your own wording, with your standard clauses untouchable. AI drafts, a person signs off." />
    <meta property="og:image" content="https://demo.orcaedge.io/og-v2.png" />
    <meta property="og:image:secure_url" content="https://demo.orcaedge.io/og-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orca Edge. Document Generation and Review. Your firm's own letters, in your own wording, with your standard clauses untouchable." />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Document Generation and Review" />
    <meta name="twitter:description" content="Your firm's own letters, in your own wording, with your standard clauses untouchable." />
    <meta name="twitter:image" content="https://demo.orcaedge.io/og-v2.png" />
    <meta name="twitter:image:alt" content="Orca Edge. Document Generation and Review." />

    <!-- The firm's own mark. The wordmark is unreadable at sixteen pixels, so the tab
         gets the orca alone and the share card gets the whole logo. -->
    <!-- Transparent, so the mark adopts whatever the browser puts behind it. A navy
         square of its own reads as a sticker in a light themed browser, and the tab bar
         is not ours to paint. Checked against a dark bar, a light one and white.
         The touch icon keeps a background, because iOS composites onto white and a
         transparent mark on a white home screen loses its edges. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-v2.png" />

    <!-- The fonts were blocking the first paint, so the page stayed blank while two
         families came down from a third party. Loaded without blocking, with a plain
         link for anyone whose browser ignores the trick. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
