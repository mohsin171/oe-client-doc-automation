<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A demo of a fictional firm has no business in search results, and a client's
         letters are behind a login that a crawler cannot pass anyway. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Orca Edge · Document Generation and Review</title>
    <meta name="description" content="A firm's own letters, counted for what never changes, so standard clauses are reproduced exactly and only the rest is written fresh. Signed off by a person, always." />
    <meta name="theme-color" content="#0E2237" />
    <meta name="color-scheme" content="light" />

    <!-- How the link looks when it is sent to a solicitor, which is how it will
         mostly arrive. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Document Generation and Review" />
    <meta property="og:description" content="Your firm's own letters, your own wording, your standard clauses untouchable." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Orca Edge" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Document Generation and Review" />
    <meta name="twitter:description" content="Your firm's own letters, your own wording, your standard clauses untouchable." />
    <meta name="twitter:image" content="/og.png" />

    <!-- The firm's own mark. The wordmark is unreadable at sixteen pixels, so the tab
         gets the orca alone and the share card gets the whole logo. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- The fonts were blocking the first paint, so the page stayed blank while two
         families came down from a third party. Loaded without blocking, with a plain
         link for anyone whose browser ignores the trick. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
